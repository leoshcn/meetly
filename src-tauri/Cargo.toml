[package]
name = "meetly"
version = "0.1.0"
description = "Meetly desktop meeting assistant"
authors = ["Meetly"]
edition = "2021"

[lib]
name = "meetly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Platform credential stores must be enabled explicitly in keyring v3;
# without them the crate falls back to an in-process mock that does not persist.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
ve-tos-rust-sdk = { version = "2.9.19", default-features = false, features = ["use-rustls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
hound = "3.5"
dirs = "5"
# CLI wrapper only — we download the Windows essentials zip ourselves (avoids xz2).
ffmpeg-sidecar = { version = "2", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
